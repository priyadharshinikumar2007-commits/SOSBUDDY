services:
  - type: web
    name: sosbuddy-frontend
    runtime: static
    plan: free
    rootDir: sosbuddy
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sos-backend-production-0e25.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html