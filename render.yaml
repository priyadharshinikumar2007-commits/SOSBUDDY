services:
  - type: web
    name: sos-backend
    runtime: node
    plan: free
    rootDir: sos-backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: sosbuddy-frontend
    runtime: static
    plan: free
    rootDir: sosbuddy
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html