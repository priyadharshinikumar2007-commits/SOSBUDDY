<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS BUDDY — Emergency Response</title>
<style>
:root{
  --bg-body:#eef3f8;--bg-app:#fff;--bg-card:#fff;--bg-card-alt:#f8fafc;
  --text-primary:#0f172a;--text-secondary:#64748b;--text-muted:#94a3b8;
  --border-color:#e5e7eb;--success-text:#16a34a;--success-bg:#dcfce7;
  --error-text:#b91c1c;--error-bg:#fee2e2;--warning-text:#92400e;--warning-bg:#fef3c7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg-body);color:var(--text-primary);line-height:1.5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:var(--bg-card);width:100%;max-width:450px;border-radius:20px;padding:30px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center;border:1px solid var(--border-color)}
.icon-wrap{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px}
.icon-wrap.success{background:var(--success-bg);color:var(--success-text)}
.icon-wrap.error{background:var(--error-bg);color:var(--error-text)}
.icon-wrap.loading{background:#e2e8f0;color:#64748b}
h1{font-size:22px;font-weight:800;margin-bottom:12px;letter-spacing:-0.5px}
p{font-size:15px;color:var(--text-secondary);margin-bottom:16px}
p.thanks{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:24px}
.incident-box{background:var(--bg-card-alt);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:24px}
.incident-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:700;margin-bottom:4px}
.incident-id{font-family:'Courier New',monospace;font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:12px}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase}
.status-badge.delivered{background:var(--success-bg);color:var(--success-text)}
.status-badge.queued{background:var(--warning-bg);color:var(--warning-text);animation:pulse 1.5s infinite}
.status-badge.error{background:var(--error-bg);color:var(--error-text)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.privacy-note{font-size:12px;color:var(--text-muted);margin-top:24px;border-top:1px solid var(--border-color);padding-top:16px}
</style>
</head>
<body>

<div class="card" id="mainCard">
  <!-- Content will be injected by JS -->
</div>

<script>
const API_BASE = 'https://sos-backend-production-0e25.up.railway.app';

// Extract token from URL
const urlParams = new URLSearchParams(window.location.search);
let token = urlParams.get('token') || urlParams.get('t');

if (!token && window.location.hash) {
    const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
    token = hashParams.get('token');
}

if (!token && window.location.pathname.includes('/scan/')) {
    token = window.location.pathname.split('/scan/')[1];
}

const card = document.getElementById('mainCard');

function showLoading() {
  card.innerHTML = `
    <div class="icon-wrap loading">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </div>
    <h1>PROCESSING EMERGENCY...</h1>
    <p>Contacting the registered hospital. Please wait.</p>
  `;
}

function showError(msg) {
  card.innerHTML = `
    <div class="icon-wrap error">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </div>
    <h1>INVALID QR CODE</h1>
    <p>${msg}</p>
  `;
}

function showSuccess(incidentId, deliveryStatus, isDuplicate) {
  let statusText = "DELIVERED";
  let statusClass = "delivered";
  
  if (deliveryStatus === "QUEUED") {
    statusText = "QUEUED - RETRYING DELIVERY";
    statusClass = "queued";
  }

  card.innerHTML = `
    <div class="icon-wrap success">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <h1>EMERGENCY ALERT SENT SUCCESSFULLY</h1>
    <p>The registered hospital has been notified.</p>
    <p class="thanks">Thank you for helping. Your action may save a life.</p>
    
    <div class="incident-box">
      <div class="incident-label">Incident ID</div>
      <div class="incident-id">${incidentId}</div>
      <div class="status-badge ${statusClass}" id="statusBadge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        ${statusText}
      </div>
    </div>

    <p class="privacy-note">Your location was NOT requested. The hospital is viewing the patient's registered details.</p>
  `;
}

if (!token) {
  showError("No secure token found in this URL. Please scan a valid SOS Buddy QR code.");
} else {
  showLoading();
  
  fetch(`${API_BASE}/api/scan/${token}`)
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        showSuccess(data.incidentId, data.deliveryStatus, data.isDuplicate);
        startPolling(data.incidentId);
      } else {
        showError(data.error || "This QR code is invalid or expired.");
      }
    })
    .catch(err => {
      showError("Network error. Could not reach the emergency server.");
      console.error(err);
    });
}

function startPolling(incidentId) {
  const badge = document.getElementById('statusBadge');
  if (!badge) return;
  
  const interval = setInterval(async () => {
    try {
      const r = await fetch(`${API_BASE}/api/incidents/${incidentId}/delivery`);
      if (!r.ok) return;
      
      const data = await r.json();
      if (data.delivery_status === 'DELIVERED' || data.delivery_status === 'ACKNOWLEDGED') {
        clearInterval(interval);
        badge.className = 'status-badge delivered';
        badge.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> DELIVERED & ACKNOWLEDGED`;
      }
    } catch(e) {
      // Ignore network blips during polling
    }
  }, 3000);
}
</script>
</body>
</html>
